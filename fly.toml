app = "api-vuelos"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 5

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/"
  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80